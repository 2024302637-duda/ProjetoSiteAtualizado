<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto Site</title>
    <link rel="stylesheet" href="../css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="fundo-site">
    <!-- Menu de Navegação -->
    <!-- Classes prontas do Bootstrap -->
    <!--Navbar-personalizada é uma estilização persolalizada -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-personalizada"> 
        <div class="container">
            <!-- Class pronta para destacar a "logo" -->
            <a class="navbar-brand" href="#inicio">SOBRE MIM</a>
            <!-- navbar-toggler-icon é uma tag pronta -->
            <button class="navbar-toggler" 
            type="button" 
            data-bs-toggle="collapse"  
            data-bs-target="#menuPrincipal"
            aria-controls="menuPrincipal"
            aria-expanded="false" aria-label="Abrir menu de navegação">
                <!-- Class pronta que cria o menu hamburguer (as três) -->
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menuPrincipal">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="#apresentacao">Apresentação</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#familia">Minha Família</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#sobre">Sobre Mim</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#contato">Contato</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <!-- Fim do Menu de Navegação -->
    <!-- Inicio do Carrossel -->
    <div id="carouselApresentacao" class="carousel slide">
        <!-- Tag do bootstrap de indicadores para selecionar cada slide -->
        <div class="carousel-indicators">
            <button type="button" data-bs-target="#carouselApresentacao" data-bs-slide-to="0" class="active"
                aria-current="true" aria-label="Apresentação">
            </button>
            <button type="button" data-bs-target="#carouselApresentacao" data-bs-slide-to="1"
                aria-label="Minha Família">
            </button>
            <button type="button" data-bs-target="#carouselApresentacao" data-bs-slide-to="2" aria-label="Sobre Mim">
            </button>
        </div>
        <!--Class pronta que agrupa as imagens -->
        <div class="carousel-inner">
            <!-- PRIMEIRO SLIDE -->
            <!-- active: define o primeiro slide como visível inicialmente -->
            <div class="carousel-item active">
                <img src="../img/1000349430.jpg" class="d-block w-100" alt="Imagem de apresentação">
                <!--legenda sobre a imagem -->
                <div class="carousel-caption">
                    <h5>Apresentação</h5>
                    <p>Um pouco sobre mim e minha história.</p>
                </div>
            </div>
            <!-- SEGUNDO SLIDE -->
            <div class="carousel-item">
                <img src="../img/minha-familia.jpeg" class="d-block w-100" alt="Imagem da minha família">
                <!-- Legenda do segundo slide -->
                <div class="carousel-caption">
                    <h5>Minha Família</h5>
                    <p>Conheça um pouco sobre minha família.</p>
                </div>
            </div>
            <!-- TERCEIRO SLIDE -->
            <div class="carousel-item">
                <img src="../img/eu2.jpeg" class="d-block w-100" alt="Imagem sobre mim">
                <!-- Legenda do tereceiro slide -->
                <div class="carousel-caption">
                    <h5>Sobre Mim</h5>
                    <p>Meus interesses, gostos e um pouco da minha personalidade.</p>
                </div>
            </div>
        </div>
        <!-- botão pronto para voltar ao slide anterior -->
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselApresentacao" data-bs-slide="prev">
            <!-- Ícone da seta para esquerda -->
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <!-- Texto acessivel para leitores de tela -->
            <span class="visually-hidden">Anterior</span>
        </button>
        <!-- botão para avançar ao próximo slide -->
        <button class="carousel-control-next" type="button" data-bs-target="#carouselApresentacao" data-bs-slide="next">
            <!-- Ícone da seta para direita -->
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <!-- Texto acessivel para leitores de tela -->
            <span class="visually-hidden">Próximo</span>
        </button>
    </div>

    <!-- Sessão 1 -->
     
    
    <script type="text/javascript" src="../js/bootstrap.bundle.min.js"></script>
    <script type="text/javascript" src="../js/script.js"></script>
</body>

</html>
